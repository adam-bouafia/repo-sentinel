[project]
name = "repo-sentinel"
version = "0.1.0"
description = "Claude Agent SDK agent that audits selected GitHub repos for failures, outdated dependencies and upstream drift"
readme = "README.md"
license = "MIT"
authors = [{ name = "Adam Bouafia", email = "adam.bouafia@student.univaq.it" }]
requires-python = ">=3.12"
dependencies = ["claude-agent-sdk>=0.2.159"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
sentinel = "sentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
